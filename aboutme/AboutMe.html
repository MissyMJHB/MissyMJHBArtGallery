<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Me - Missy Art Gallery</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" href="../Book/MissyCutOut.png">
  <style>
    /* Grayscale filter for locked mode */
    body.grayscale .aboutme-img-container img {
      filter: grayscale(1) brightness(0.92);
      transition: filter 0.3s;
    }
    body.grayscale {
      filter: grayscale(1) brightness(0.97);
    }
    body.grayscale .main-nav a:hover,
    body.grayscale .main-nav a:focus,
    body.grayscale .main-nav a:active {
      filter: none !important;
      color: #e6007a !important;
    }
    body { 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      transition: filter 0.4s; 
    }
    /* Option A: make the about image act like a tall page section (4 viewports tall) so the browser scrollbar scrolls through the image */
    .aboutme-img-container {
      width: 100vw;
      display: block;
      margin: 0 auto 2.5rem auto;
      overflow: visible; /* allow page to scroll instead of inner scrollbars */
      height: auto;
      padding: 0;
    }
    .aboutme-img-container img {
      display: block;
      width: 100%;
      /* make the image exactly 4 viewports tall so each viewport displays one quarter */
      height: 400vh; /* 4 × 100vh */
      max-width: none;
      object-fit: cover; /* fill the viewport width while preserving crop */
      object-position: top center; /* start cropping from the top so top section is visible first */
      border-radius: 1.2rem 1.2rem 0 0;
      box-shadow: 0 4px 32px #0003;
      background: #fff;
      margin: 0 auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    @media (max-width: 900px) {
      .aboutme-img-container img {
        /* slightly reduced for medium screens to keep quarters visible */
        height: 360vh;
        border-radius: 0.7rem 0.7rem 0 0;
      }
    }
    @media (max-width: 420px) {
      .aboutme-img-container img {
        /* compact for narrow phones */
        height: 320vh;
      }
    }
    .back-to-top {
      position: fixed;
      right: 2vw;
      bottom: 2vw;
      background: #e6007a;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 2rem;
      box-shadow: 0 2px 12px #0003;
      cursor: pointer;
      display: none;
      z-index: 2000;
      transition: background 0.2s;
    }
    .back-to-top:hover {
      background: #7c3aed;
    }
  </style>
</head>
<body class="page-bg">
  <nav class="main-nav">
    <a href="../index.html">Home</a>
    <a href="../gallery.html">Gallery</a>
    <a href="#" id="contactLink">Contact</a>
  </nav>
  <h1 class="site-title" id="animatedTitle"><span id="wordMissy">Missy</span> <span id="wordArt">Art</span> <span id="wordGallery">Gallery</span></h1>
  <div class="aboutme-img-container">
    <img src="Aboutme500.jpg" alt="About Me" />
  </div>
  <script src="../core.js"></script>
  <script>
    // Rely on core.js for unlock state; just mark About as visited
    try { localStorage.setItem('visited_about', '1'); } catch(e) {}
  </script>

<script>
    // --- Missy Widget (bottom right, always visible, random bubble, clickable) ---
    document.addEventListener('DOMContentLoaded', function() {
      // Create Missy widget container if not present
      let missyWidget = document.getElementById('missyCornerWidget');
      if (!missyWidget) {
        missyWidget = document.createElement('div');
        missyWidget.id = 'missyCornerWidget';
        missyWidget.className = 'missy-corner-widget';
        document.body.appendChild(missyWidget);
        // enforce fixed placement and ensure visible above content
        missyWidget.style.position = 'fixed';
        missyWidget.style.right = '12px';
        missyWidget.style.bottom = '12px';
        missyWidget.style.zIndex = '1000001';
        missyWidget.style.pointerEvents = 'auto';
      }
      // Add Missy image
      let missyImg = document.getElementById('missyCornerImg');
      if (!missyImg) {
        missyImg = document.createElement('img');
        missyImg.id = 'missyCornerImg';
        missyImg.className = 'missy-corner-img';
        missyImg.src = '../Book/MissyCutOut.png';
        missyImg.alt = 'Missy';
        missyImg.tabIndex = 0;
        missyWidget.appendChild(missyImg);
      }
      // Add Missy bubble
      let missyBubble = document.getElementById('missyCornerBubble');
      if (!missyBubble) {
        missyBubble = document.createElement('img');
        missyBubble.id = 'missyCornerBubble';
        missyBubble.className = 'missy-bubble bubble-hidden';
        missyBubble.style.position = 'absolute';
        missyBubble.style.right = '110%';
        missyBubble.style.top = '-55px';
        missyBubble.style.width = '110px';
        // keep bubble non-interactive until shown (CSS handles pointer-events when visible)
        missyBubble.style.pointerEvents = 'none';
        missyWidget.appendChild(missyBubble);
        // Ensure Missy bubble uses PNG backgrounds when needed (for non-img fallback)
        missyBubble.style.backgroundRepeat = 'no-repeat';
        missyBubble.style.backgroundSize = 'contain';
        missyBubble.style.backgroundPosition = 'center';
      }
      // Bubble images and texts
      const bubbles = [
        {src: '../Book/BubbleHi.png', text: 'Hi! Welcome!'},
        {src: '../Book/BubbleClick.png', text: 'Click me for a surprise!'},
        {src: '../Book/BubblePretty.png', text: "Pretty, isn't it?"},
        {src: '../Book/BubbleShowAround.png', text: 'Let me show you around!'},
        {src: '../Book/BubblePeaceful.png', text: "It's so peaceful here."},
        {src: '../Book/BubbleFeelFree.png', text: 'Feel free to explore!'},
        {src: '../Book/BubbleOops.png', text: 'Oops! Try again!', onShow: function(){
          if(window.showOopsOverlay) window.showOopsOverlay({ src: '../Book/OopsImage.png', showDuration: 6000, bubbleSrc: '../Book/BubbleOops.png', redirectPages: ['../index.html','../gallery.html','AboutMe.html'] });
        }},


        {src: '../Book/BubbleAuthor.png', text: 'An author liked my painting so much, she commissioned me for her book cover!'},
        {src: '../Book/BubbleLike.png', text: 'Do you like this?'}
      ];
      function showRandomBubble() {
        const pick = bubbles[Math.floor(Math.random() * bubbles.length)];
        missyBubble.src = pick.src;
        missyBubble.alt = pick.text;
        // If bubble has onShow handler, call it
        if(pick.onShow && typeof pick.onShow === 'function'){
          pick.onShow();
        }
        missyBubble.classList.remove('bubble-hidden');
        missyBubble.classList.add('show');
        setTimeout(() => {
          missyBubble.classList.remove('show');
          missyBubble.classList.add('bubble-hidden');
        }, 3200);
      }
      // Show bubble on hover
      missyImg.addEventListener('mouseenter', function(){ missyImg.classList.add('color'); showRandomBubble(); });
      // Show bubble on focus (keyboard accessibility)
      missyImg.addEventListener('focus', function(){ missyImg.classList.add('color'); showRandomBubble(); });
      // Show bubble on click
      missyImg.addEventListener('click', function(e) {
        e.preventDefault();
        showRandomBubble();
        // if bubble isn't Oops, navigate randomly
        setTimeout(()=>{
          // Find a random page
          const pages = ['../index.html','../gallery.html','AboutMe.html'];
          const pick = pages[Math.floor(Math.random()*pages.length)];
          window.location.href = pick;
        }, 350);
      });
      // Make Missy clickable (pointer)
      missyImg.style.cursor = 'pointer';
      // Ensure widget is always in view (responsive)
      function keepMissyInView() {
        const widget = missyWidget;
        if (!widget) return;
        // Clamp right/bottom to always be visible
        widget.style.right = `max(1vw, 12px)`;
        widget.style.bottom = `max(1vw, 12px)`;
      }
      window.addEventListener('resize', keepMissyInView);
      keepMissyInView();
    });
  </script>
</body>
</html>
