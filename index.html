<!DOCTYPE html>
<!-- 1442:0324 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Art Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/Book/MissyCutOut.png">
</head>
<body>
    <div class="home-bg">
      <div class="color-reveal"></div>
      <div class="home-overlay home-overlay-top">
        <h1 class="site-title" id="animatedTitle">
          <span id="wordMissy">Missy</span> <span id="wordArt">Art</span> <span id="wordGallery">Gallery</span>
        </h1>
        <nav class="main-nav">
          <!-- Home link omitted on homepage -->
          <a href="gallery.html">Gallery</a>
          <a href="aboutme/AboutMe.html">About</a>
          <a href="#" id="contactLink">Contact</a>
        </nav>
        <div class="site-subtitle" id="animatedSubtitle">Make your day brighter</div>
                <!-- Contact Modal -->
                <div id="contactModal" class="contact-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:2000;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
                  <div class="contact-modal-content" style="background:#fff;padding:2rem 2.5rem;border-radius:1.2rem;box-shadow:0 2px 16px #0003;position:relative;max-width:90vw;width:350px;text-align:center;">
                    <button id="closeContactModal" style="position:absolute;top:1rem;right:1rem;font-size:1.5rem;background:none;border:none;cursor:pointer;color:#e6007a;">&times;</button>
                    <h2>Contact</h2>
                    <p>Email: <a href="mailto:your@email.com">your@email.com</a></p>
                    <p>Instagram: <a href="https://instagram.com/yourprofile" target="_blank">@yourprofile</a></p>
                  </div>
                </div>
        <div class="missy-area" id="missyArea">
          <a href="#" id="missyLink" class="missy-link">
            <img src="Book/MissyCutOut.png" alt="Missy" id="missyImg" class="missy-img" />
            <!-- Missy widget and logic handled in separate script below -->
  <!-- Modal for full image view (shared with gallery) -->
  <div class="modal" id="imageModal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImg" alt="" />
  </div>

  <script src="core.js"></script>
  <script src="gallery.js"></script>
  
  <script>
    // Contact Modal logic
    document.addEventListener('DOMContentLoaded', function () {
      const contactLink = document.getElementById('contactLink');
      const contactModal = document.getElementById('contactModal');
      const closeContactModal = document.getElementById('closeContactModal');
      contactLink.addEventListener('click', function(e) {
        e.preventDefault();
        contactModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      });
      closeContactModal.addEventListener('click', function() {
        contactModal.style.display = 'none';
        document.body.style.overflow = '';
      });
      contactModal.addEventListener('click', function(e) {
        if (e.target === contactModal) {
          contactModal.style.display = 'none';
          document.body.style.overflow = '';
        }
      });
    });
  </script>
</button>
<script>
  // Missy widget: always visible, random bubble, color on hover, random page on click
  document.addEventListener('DOMContentLoaded', function() {
    const missyLink = document.getElementById('missyLink');
    const missyImg = document.getElementById('missyImg');
    // Create bubble image if not present
    let missyBubble = document.getElementById('missyBubble');
    if (!missyBubble) {
      missyBubble = document.createElement('img');
      missyBubble.id = 'missyBubble';
      missyBubble.className = 'missy-bubble bubble-hidden';
      missyLink.appendChild(missyBubble);
    }
    const area = document.getElementById('missyArea');
    // All bubble images
    const bubbles = [
      {src: 'Book/BubbleHi.png', text: 'Hi! Welcome!'},
      {src: 'Book/BubbleClick.png', text: 'Click me for a surprise!'},
      {src: 'Book/BubblePretty.png', text: 'Pretty, isn\'t it?'},
      {src: 'Book/BubbleShowAround.png', text: 'Let me show you around!'},
      {src: 'Book/BubblePeaceful.png', text: 'It\'s so peaceful here.'},
      {src: 'Book/BubbleFeelFree.png', text: 'Feel free to explore!'},
      {src: 'Book/BubbleOops.png', text: 'Oops! Try again!'},
      {src: 'Book/BubbleAuthor.png', text: 'An author liked my painting so much, she commissioned me for her book cover!'},
      {src: 'Book/BubbleLike.png', text: 'Do you like this?'}
    ];
    function showRandomBubble() {
      const pick = bubbles[Math.floor(Math.random() * bubbles.length)];
      missyBubble.src = pick.src;
      missyBubble.alt = pick.text;
      missyBubble.classList.remove('bubble-hidden');
      missyBubble.classList.add('show');
      // Special case for Oops
      if (pick.src === 'Book/BubbleOops.png') {
        if(window.showOopsOverlay) window.showOopsOverlay({ src: 'Book/Oops.png', showDuration: 6000, bubbleSrc: 'Book/BubbleOops.png', redirectPages: ['index.html','gallery.html','aboutme/AboutMe.html'] });
      }
    }
    function hideBubble() {
      missyBubble.classList.add('bubble-hidden');
      missyBubble.classList.remove('show');
    }
    function missyRedirect() {
      const pages = [
        { url: 'index.html', name: 'Home' },
        { url: 'gallery.html', name: 'Gallery' },
        { url: 'aboutme/AboutMe.html', name: 'About Me' }
      ];
      const current = window.location.pathname.split('/').pop().toLowerCase();
      const filtered = pages.filter(p => !current.includes(p.url.toLowerCase()));
      const pick = filtered[Math.floor(Math.random() * filtered.length)];
      window.location.href = pick.url;
    }
    function positionMissy() {
      if (!area) return;
      if (window.innerWidth < 700) {
        area.style.left = '50%';
        area.style.right = '';
        area.style.transform = 'translateX(-50%)';
      } else {
        area.style.left = '';
        area.style.right = '6vw';
        area.style.transform = '';
      }
      area.style.bottom = '2vw';
      area.style.position = 'fixed';
      area.style.zIndex = 1000;
    }
    window.addEventListener('resize', positionMissy);
    positionMissy();
    // Attach events only if elements exist
    if (missyLink && missyImg && missyBubble) {
      // Desktop hover
      missyLink.addEventListener('mouseenter', function() {
        missyImg.classList.add('color');
        showRandomBubble();
      });
      missyLink.addEventListener('mouseleave', function() {
        missyImg.classList.remove('color');
        hideBubble();
      });
      // Desktop click
      missyLink.addEventListener('click', function(e) {
        e.preventDefault();
        if (missyBubble.src && missyBubble.src.includes('BubbleOops.png')) return;
        missyRedirect();
      });
      // Touch support for mobile
      let bubbleVisible = false;
      missyLink.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (!bubbleVisible) {
          missyImg.classList.add('color');
          showRandomBubble();
          bubbleVisible = true;
        } else {
          missyImg.classList.remove('color');
          hideBubble();
          bubbleVisible = false;
          // Simulate click on second tap
          if (missyBubble.src && missyBubble.src.includes('BubbleOops.png')) return;
          missyRedirect();
        }
      }, {passive: false});
    }
  });
</script>
  <button id="backToTop" title="Back to top">▲</button>
</body>
</html>
