<!DOCTYPE html>
<html lang="en" class="blank-bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missy Art Gallery - Blank Canvas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="assets/MissyCutOut.png">
</head>
<body class="blank-bg">
    <div id="draw-controls">
        <a href="index.html" id="home-btn" class="draw-home-btn">Home</a>
        <button id="erase-btn">Erase</button>
        <input type="color" id="color-picker" value="#000000" title="Pick a color">
        <label for="tool-select" class="tool-label">Tool:</label>
        <select id="tool-select" title="Drawing tool">
            <option value="pen">Pen</option>
            <option value="marker">Marker</option>
            <option value="crayon">Crayon</option>
        </select>
    </div>
    <canvas id="draw-canvas"></canvas>
    <script src="assets/html2canvas.min.js"></script>
    <script>
        // Prevent accidental swipe navigation on mobile
        const drawCanvas = document.getElementById('draw-canvas');
        if (drawCanvas) {
            drawCanvas.addEventListener('touchmove', function (e) {
                if (e.touches.length === 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        }
        document.body.addEventListener('touchmove', function (e) {
            if (e.target === drawCanvas) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
    <script>
        // Ensure canvas matches CSS size for drawing
        function resizeCanvas() {
            const canvas = document.getElementById('draw-canvas');
            if (!canvas) return;
            // Get computed size
            const rect = canvas.getBoundingClientRect();
            // Only set if changed to avoid flicker
            if (canvas.width !== Math.round(rect.width) || canvas.height !== Math.round(rect.height)) {
                canvas.width = Math.round(rect.width);
                canvas.height = Math.round(rect.height);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', resizeCanvas);
    </script>
    <script src="assets/drawing-canvas.js"></script>
    <script>
        // Color wave erase animation (only affects drawing area)
        document.getElementById('erase-btn').onclick = function () {
            const canvas = document.getElementById('draw-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const width = canvas.width;
            const height = canvas.height;
            let waveX = -200;
            function animate() {
                ctx.save();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(waveX, 0);
                ctx.lineTo(waveX + 200, 0);
                ctx.lineTo(waveX + 160, height);
                ctx.lineTo(waveX - 40, height);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                waveX += 32;
                if (waveX - 40 < width) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.save();
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();
                }
            }
            animate();
        }
    </script>
    <style>
    body.blank-bg, html {
      overscroll-behavior: none;
      touch-action: none;
      margin: 0;
      padding: 0;
      background: #fff;
      min-height: 100vh;
      overflow: hidden;
    }
    #draw-controls {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f8f8f8;
      padding: 8px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .draw-home-btn {
      color: #222;
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.4em 1em;
      text-decoration: none;
      margin-right: 0.5em;
      transition: background 0.2s, color 0.2s;
    }
    .draw-home-btn:hover {
      background: #222;
      color: #fff;
    }
    #draw-canvas {
      position: absolute;
      top: 48px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 48px);
      background: #fff;
      touch-action: none;
      display: block;
    }
    </style>
</body>
</html>
