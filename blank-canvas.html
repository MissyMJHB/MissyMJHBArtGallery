  <script>
    // Prevent accidental swipe navigation on mobile
    const drawCanvas = document.getElementById('draw-canvas');
    if (drawCanvas) {
      drawCanvas.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1) {
          e.preventDefault();
        }
      }, { passive: false });
    }
    document.body.addEventListener('touchmove', function(e) {
      if (e.target === drawCanvas) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
  <script>
    // Ensure canvas matches CSS size for drawing
    function resizeCanvas() {
      const canvas = document.getElementById('draw-canvas');
      if (!canvas) return;
      // Get computed size
      const rect = canvas.getBoundingClientRect();
      // Only set if changed to avoid flicker
      if (canvas.width !== Math.round(rect.width) || canvas.height !== Math.round(rect.height)) {
        canvas.width = Math.round(rect.width);
        canvas.height = Math.round(rect.height);
      }
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', resizeCanvas);
  </script>
  <script src="assets/drawing-canvas.js"></script>
  <script>
  // Color wave erase animation (only affects drawing area)
  document.getElementById('erase-btn').onclick = function() {
    const canvas = document.getElementById('draw-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const width = canvas.width;
    const height = canvas.height;
    let waveX = -200;
    function animate() {
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(waveX, 0);
      ctx.lineTo(waveX+200, 0);
      ctx.lineTo(waveX+160, height);
      ctx.lineTo(waveX-40, height);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      waveX += 32;
      if (waveX-40 < width) {
        requestAnimationFrame(animate);
      } else {
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,width,height);
        ctx.restore();
      }
    }
    animate();
  }
  </script>
